# Pre-commit configuration for Hugo static site
# See https://pre-commit.com for more information
repos:
  # Basic file checks and formatting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-ast  # Python syntax check
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml
      - id: debug-statements  # Python debug imports
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: pretty-format-json
        args: ['--autofix']
      - id: sort-simple-yaml
        args: ['--autofix']
      - id: trailing-whitespace

  # YAML linting and formatting
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: ['-c=.yamllint.yml', '-f', 'colored']

  # TOML formatting
  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.15.0
    hooks:
      - id: pretty-format-toml
        args: [--autofix]

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        args: ['--config=.markdownlint.yml', '--fix']

  # HTML validation for Hugo templates
  - repo: https://github.com/Riverside-Healthcare/djLint
    rev: v1.36.4
    hooks:
      - id: djlint-reformat-django
        files: \.html$
        args: [--profile=django, --max-line-length=120]
      - id: djlint-django
        files: \.html$
        args: [--profile=django, --max-line-length=120]

  # # Security scanning
  # - repo: https://github.com/Yelp/detect-secrets
  #   rev: v1.5.0
  #   hooks:
  #     - id: detect-secrets
  #       args: [--baseline, .secrets.baseline]
  #       exclude: package.lock.json

  # Additional security scanning with Bandit (for any Python scripts)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: [--ini, .bandit]
        files: \.py$


  # Hugo specific checks
  - repo: local
    hooks:
      - id: hugo-build-check
        name: Hugo build test
        entry: hugo
        args: [--minify, --destination, /tmp/hugo-build-test]
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: hugo-front-matter-check
        name: Check Hugo front matter syntax
        entry: bash
        args:
          - -c
          - |
            for file in $(find content -name "*.md" -type f); do
              if ! head -n 20 "$file" | grep -q "^---$"; then
                echo "Missing front matter in $file"
                exit 1
              fi
            done
        language: system
        files: ^content/.*\.md$
        pass_filenames: false

      - id: image-optimization-check
        name: Check for unoptimized images
        entry: bash
        args:
          - -c
          - |
            large_images=$(find static -name "*.jpg" -o -name "*.jpeg" -o -name "*.png" | xargs ls -la | awk '$5 > 1048576 {print $9, $5}')
            if [ -n "$large_images" ]; then
              echo "Large images found (>1MB). Consider optimizing:"
              echo "$large_images"
              exit 1
            fi
        language: system
        pass_filenames: false

  # Spell checking
  - repo: https://github.com/crate-ci/typos
    rev: v1
    hooks:
      - id: typos
        args: [--config, .typos.toml]
