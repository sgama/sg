name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'tests/README.md'
  pull_request:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'tests/README.md'

permissions:
  contents: read

# Production pushes queue behind each other; PR pushes replace the older run.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUGO_VERSION: 0.167.0
  HUGO_CACHEDIR: /tmp/hugo_cache

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Read pinned actionlint version
        id: actionlint-version
        run: echo "version=$(make -s print-ACTIONLINT_VERSION)" >> "${GITHUB_OUTPUT}"

      # Two cache entries with different lifetimes, so a content-only change never re-uploads
      # the large, slow-moving one:
      #   tools:  actionlint, Hugo and node_modules. Keyed by tool versions and the lockfile.
      #   hugo-gen: processed images and assets (resources/_gen) and Hugo's compiled WebAssembly
      #           (_warpc). Small; keyed by the inputs that change the output and restored from the
      #           closest previous entry so unchanged images are never reprocessed.
      # The Blowfish module (~365 MB) is deliberately not cached: downloading it takes about 3 s,
      # less than restoring and re-saving it.
      - uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/actionlint
            ${{ runner.temp }}/hugo
            node_modules
          key: ${{ runner.os }}-tools-${{ env.HUGO_VERSION }}-${{ steps.actionlint-version.outputs.version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-tools-${{ env.HUGO_VERSION }}-${{ steps.actionlint-version.outputs.version }}-
      - uses: actions/cache@v6
        with:
          path: |
            resources/_gen
            ${{ env.HUGO_CACHEDIR }}/_warpc
          key: ${{ runner.os }}-hugo-gen-${{ env.HUGO_VERSION }}-${{ hashFiles('config.toml', 'layouts/**', 'content/**', 'assets/**') }}
          restore-keys: |
            ${{ runner.os }}-hugo-gen-${{ env.HUGO_VERSION }}-

      # Tools are checked on disk, not by cache-hit, so a partial restore still works.
      - name: Install actionlint
        run: make install-actionlint ACTIONLINT_BIN_DIR="${RUNNER_TEMP}/actionlint"
      - name: Install Hugo if missing
        run: |
          if [ ! -x "${RUNNER_TEMP}/hugo/hugo" ]; then
            mkdir -p "${RUNNER_TEMP}/hugo"
            curl --fail --silent --show-error --location \
              "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
              | tar -xz -C "${RUNNER_TEMP}/hugo"
          fi
          echo "${RUNNER_TEMP}/actionlint" >> "${GITHUB_PATH}"
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # npm ci wipes node_modules, so reinstall only when the lockfile differs from
      # the one recorded in the restored node_modules.
      - name: Install Node dependencies
        run: make deps

      # The offline checks are independent, so they run together (public runners have 4 vCPUs);
      # --output-sync keeps each target's log in one block. Make orders PostCSS before Hugo.
      - name: Lint, test and build
        run: make -j4 --output-sync=target lint-workflows lint format-check ai-check coverage ai-build build-prod test-layouts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: javascript-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
      # Needs the production build, so it runs after the parallel block.
      - run: make csp-headers

      # Deploy only on push to develop; PRs stop after validation.
      - name: Refresh corpus, deploy, and prune
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          make ai-refresh
          make deploy-built
          make cleanup-deployments
