name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUGO_VERSION: 0.167.0
      HUGO_CACHEDIR: /tmp/hugo_cache
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Read pinned actionlint version
        id: actionlint-version
        run: |
          version=$(awk '$1 == "ACTIONLINT_VERSION" && $2 == ":=" { print $3 }' Makefile)
          test -n "$version"
          echo "version=$version" >> "${GITHUB_OUTPUT}"
      - uses: actions/cache@v6
        id: actionlint-cache
        with:
          path: ${{ runner.temp }}/actionlint
          key: ${{ runner.os }}-${{ runner.arch }}-actionlint-${{ steps.actionlint-version.outputs.version }}
      - uses: actions/setup-go@v7
        if: steps.actionlint-cache.outputs.cache-hit != 'true'
        with:
          go-version-file: go.mod
          cache: false
      - name: Install actionlint
        if: steps.actionlint-cache.outputs.cache-hit != 'true'
        run: GOBIN="${RUNNER_TEMP}/actionlint" make install-actionlint
      - run: echo "${RUNNER_TEMP}/actionlint" >> "${GITHUB_PATH}"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: make deps
      - run: make lint-workflows
      - run: make lint
      - run: make format-check

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUGO_VERSION: 0.167.0
      HUGO_CACHEDIR: /tmp/hugo_cache
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Cache Hugo binary
        id: hugo-binary-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hugo
          key: ${{ runner.os }}-hugo-bin-${{ env.HUGO_VERSION }}
      - name: Install Hugo
        if: steps.hugo-binary-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/hugo"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --silent --show-error --location \
            "${release}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | tar -xz -C "${{ runner.temp }}/hugo"
      - run: echo "${{ runner.temp }}/hugo" >> "${GITHUB_PATH}"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: make deps
      - run: make coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: javascript-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUGO_VERSION: 0.167.0
      HUGO_CACHEDIR: /tmp/hugo_cache
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Cache Hugo binary
        id: hugo-binary-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hugo
          key: ${{ runner.os }}-hugo-bin-${{ env.HUGO_VERSION }}
      - name: Install Hugo
        if: steps.hugo-binary-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/hugo"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --silent --show-error --location \
            "${release}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | tar -xz -C "${{ runner.temp }}/hugo"
      - run: echo "${{ runner.temp }}/hugo" >> "${GITHUB_PATH}"
      - name: Restore Hugo build cache
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: ${{ runner.os }}-hugo-${{ env.HUGO_VERSION }}-${{ hashFiles('config.toml', 'layouts/**', 'content/**', 'assets/**') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-hugo-${{ env.HUGO_VERSION }}-
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: make deps
      - run: make ai-check
      - run: make ai-build
      - run: make build-prod
      - run: make csp-headers
      - run: make test-layouts
      - name: Save Hugo build cache
        if: success()
        uses: actions/cache/save@v5
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      HUGO_VERSION: 0.167.0
      HUGO_CACHEDIR: /tmp/hugo_cache
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: make deps
      - run: make audit-site

  deploy:
    if: github.event_name == 'push'
    needs: [lint, unit-tests, build, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HUGO_VERSION: 0.167.0
      HUGO_CACHEDIR: /tmp/hugo_cache
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Cache Hugo binary
        id: hugo-binary-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hugo
          key: ${{ runner.os }}-hugo-bin-${{ env.HUGO_VERSION }}
      - name: Install Hugo
        if: steps.hugo-binary-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/hugo"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --silent --show-error --location \
            "${release}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | tar -xz -C "${{ runner.temp }}/hugo"
      - run: echo "${{ runner.temp }}/hugo" >> "${GITHUB_PATH}"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: make deps
      - run: make ai-refresh
      - run: make deploy-built
      - run: make cleanup-deployments
