name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'tests/README.md'
  pull_request:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'tests/README.md'

permissions:
  contents: read

# Production pushes queue behind each other; PR pushes replace the older run.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUGO_VERSION: 0.167.0
  HUGO_CACHEDIR: /tmp/hugo_cache

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Read pinned actionlint version
        id: actionlint-version
        run: |
          version=$(awk '$1 == "ACTIONLINT_VERSION" && $2 == ":=" { print $3 }' Makefile)
          test -n "$version"
          echo "version=$version" >> "${GITHUB_OUTPUT}"

      # One cache entry holds every reusable artifact: tool binaries, node_modules and
      # Hugo's build state. Keys hash the inputs that change each artifact, and the
      # restore-keys fall back to the closest previous entry.
      - uses: actions/cache@v6
        id: cache
        with:
          path: |
            ${{ runner.temp }}/actionlint
            ${{ runner.temp }}/hugo
            node_modules
            ${{ env.HUGO_CACHEDIR }}
          key: ${{ runner.os }}-pipeline-${{ env.HUGO_VERSION }}-${{ steps.actionlint-version.outputs.version }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('config.toml', 'layouts/**', 'content/**', 'assets/**') }}
          restore-keys: |
            ${{ runner.os }}-pipeline-${{ env.HUGO_VERSION }}-${{ steps.actionlint-version.outputs.version }}-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-pipeline-${{ env.HUGO_VERSION }}-${{ steps.actionlint-version.outputs.version }}-

      # Tools are checked on disk, not by cache-hit, so a partial restore still works.
      - name: Install missing tools
        env:
          ACTIONLINT_VERSION: ${{ steps.actionlint-version.outputs.version }}
        run: |
          if [ ! -x "${RUNNER_TEMP}/actionlint/actionlint" ]; then
            mkdir -p "${RUNNER_TEMP}/actionlint"
            curl --fail --silent --show-error --location \
              "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz" \
              | tar -xz -C "${RUNNER_TEMP}/actionlint"
          fi
          if [ ! -x "${RUNNER_TEMP}/hugo/hugo" ]; then
            mkdir -p "${RUNNER_TEMP}/hugo"
            curl --fail --silent --show-error --location \
              "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
              | tar -xz -C "${RUNNER_TEMP}/hugo"
          fi
          echo "${RUNNER_TEMP}/actionlint" >> "${GITHUB_PATH}"
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # npm ci wipes node_modules, so reinstall only when the lockfile differs from
      # the one recorded in the restored node_modules.
      - name: Install Node dependencies
        env:
          LOCK_HASH: ${{ hashFiles('package-lock.json') }}
        run: |
          if [ "$(cat node_modules/.lock-hash 2>/dev/null)" != "${LOCK_HASH}" ]; then
            make deps
            echo "${LOCK_HASH}" > node_modules/.lock-hash
          fi

      # Cheap-first ordering: each stage fails before the slower ones start.
      - run: make lint-workflows
      - run: make lint format-check
      - run: make ai-check
      - run: make coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: javascript-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      # Build outputs are independent of each other, so they run concurrently.
      - name: Bundle functions and build production site
        run: make -j2 --output-sync=target ai-build build-prod
      - run: make csp-headers
      # Reads only repository sources, so it does not need the build output.
      - run: make test-layouts

      # Deploy only on push to develop; PRs stop after validation.
      - name: Refresh corpus, deploy, and prune
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          make ai-refresh
          make deploy-built
          make cleanup-deployments
