name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - develop

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.160.0
      HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 1

      - name: Cache Hugo binary
        id: hugo-binary-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/hugo
          key: hugo-bin-${{ env.HUGO_VERSION }}

      - name: Install Hugo
        if: steps.hugo-binary-cache.outputs.cache-hit != 'true'
        run: |
          curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${{ runner.temp }}/hugo"
          tar -C "${{ runner.temp }}/hugo" -xf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"

      - name: Add Hugo to PATH
        run: echo "${{ runner.temp }}/hugo" >> "${GITHUB_PATH}"

      - name: Restore Hugo build cache
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ github.run_id }}
          restore-keys: hugo-

      - name: Restore npm cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Node dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # - name: Audit content front matter
      #   run: make audit-content

      # - name: Audit external links
      #   run: make audit-urls

      - name: Detect embedding-relevant changes
        id: changed
        uses: dorny/paths-filter@v4
        with:
          filters: |
            embeddings:
              - 'content/**'
              - 'scripts/generate_embeddings.mjs'
              - 'tests/rag_eval.json'
              - 'functions/_lib/ai.js'
              - 'functions/_lib/config.js'

      - name: Generate AI Embeddings
        if: steps.changed.outputs.embeddings == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: make ai-embeddings

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: make deploy-pages

      - name: Build summary
        run: make build-summary

      - name: Save Hugo build cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Clean up old deployments
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: make cleanup-deployments
