name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - develop

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Cache Hugo modules and npm packages
        uses: actions/cache@v4
        with:
          path: |
            /tmp/hugo_cache
            ~/.cache/hugo_cache
            ~/.npm
            resources/_gen
          key: ${{ runner.os }}-build-${{ hashFiles('**/go.sum', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Build
        run: hugo --gc --minify --cleanDestinationDir

      - name: Optimize assets
        run: |
          # Install optimization tools
          npm install -g html-minifier-terser svgo critical
          
          # Extract and inline critical CSS for faster initial render
          for htmlfile in public/index.html public/*/index.html; do
            if [ -f "$htmlfile" ]; then
              critical "$htmlfile" --base public --inline --minify > "${htmlfile}.critical"
              mv "${htmlfile}.critical" "$htmlfile"
            fi
          done
          
          # Further minify HTML
          find public -name "*.html" -type f -exec html-minifier-terser --collapse-whitespace --remove-comments --minify-css true --minify-js true {} -o {} \;
          
          # Optimize SVGs
          find public -name "*.svg" -type f -exec svgo {} -o {} \;

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=sg --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }} --commit-message="${{ github.event.head_commit.message }}"
