name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - develop

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_CACHEDIR: /tmp/hugo_cache
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 1

      - name: Cache Hugo modules and npm packages
        uses: actions/cache@v5
        with:
          path: |
            /tmp/hugo_cache
            ~/.cache/hugo_cache
            ~/.npm
            node_modules
            resources/_gen
          key: ${{ runner.os }}-build-${{ hashFiles('**/go.sum', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Install Node dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Audit content front matter
        run: make audit-content

      - name: Audit external links
        run: make audit-urls

      - name: Detect embedding-relevant changes
        id: changed
        uses: dorny/paths-filter@v4
        with:
          filters: |
            embeddings:
              - 'content/**'
              - 'scripts/generate_embeddings.mjs'
              - 'tests/rag_eval.json'
              - 'functions/_lib/ai.js'
              - 'functions/_lib/config.js'

      - name: Generate AI Embeddings
        if: steps.changed.outputs.embeddings == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: make ai-embeddings

      - name: Skip AI Embeddings (no relevant changes)
        if: steps.changed.outputs.embeddings != 'true'
        run: echo "No embedding-related changes detected; skipping make ai-embeddings"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: make deploy-pages

      - name: Clean up old deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: make cleanup-deployments
