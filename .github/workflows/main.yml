name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - develop

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Cache Hugo modules and npm packages
        uses: actions/cache@v4
        with:
          path: |
            /tmp/hugo_cache
            ~/.cache/hugo_cache
            ~/.npm
            resources/_gen
          key: ${{ runner.os }}-build-${{ hashFiles('**/go.sum', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Build
        run: hugo --gc --minify --cleanDestinationDir

      - name: Optimize assets
        run: |
          # Install optimization tools
          npm install -g html-minifier-terser svgo
          
          # Minify HTML
          find public -name "*.html" -type f -exec html-minifier-terser --collapse-whitespace --remove-comments --minify-css true --minify-js true {} -o {} \;
          
          # Optimize SVGs
          find public -name "*.svg" -type f -exec svgo {} -o {} \;

      - name: Build summary
        run: |
          echo "=== Build Output Summary ==="
          echo "Total files: $(find public -type f | wc -l)"
          echo "Total directories: $(find public -type d | wc -l)"
          echo "Total size: $(du -sh public | cut -f1)"
          echo ""
          echo "=== File type breakdown ==="
          echo "HTML files: $(find public -name "*.html" -type f | wc -l) ($(du -ch public/**/*.html 2>/dev/null | tail -1 | cut -f1))"
          echo "CSS files: $(find public -name "*.css" -type f | wc -l) ($(du -ch public/**/*.css 2>/dev/null | tail -1 | cut -f1))"
          echo "JS files: $(find public -name "*.js" -type f | wc -l) ($(du -ch public/**/*.js 2>/dev/null | tail -1 | cut -f1))"
          echo "Image files: $(find public \( -name "*.jpg" -o -name "*.jpeg" -o -name "*.png" -o -name "*.webp" -o -name "*.svg" \) -type f | wc -l) ($(du -ch public/**/*.{jpg,jpeg,png,webp,svg} 2>/dev/null | tail -1 | cut -f1))"
          echo ""
          echo "=== Largest files ==="
          find public -type f -exec du -h {} + | sort -rh | head -10

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=sg --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }} --commit-message="${{ github.event.head_commit.message }}"
