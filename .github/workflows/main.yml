name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.167.0
  HUGO_CACHEDIR: /tmp/hugo_cache

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
      - run: make lint-workflows
      - run: make lint
      - run: make format-check
      - run: make audit-site
        continue-on-error: true

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
        with:
          hugo: 'true'
      - name: Restore Hugo cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: ${{ runner.os }}-hugo-${{ env.HUGO_VERSION }}-${{ hashFiles('config.toml', 'layouts/**', 'content/**', 'assets/**') }}
          restore-keys: |
            ${{ runner.os }}-hugo-${{ env.HUGO_VERSION }}-
      - run: make coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: javascript-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
        with:
          hugo: 'true'
      - name: Restore Hugo build cache
        id: cache-restore
        uses: actions/cache@v6
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: ${{ runner.os }}-hugo-${{ env.HUGO_VERSION }}-${{ hashFiles('config.toml', 'layouts/**', 'content/**', 'assets/**') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-hugo-${{ env.HUGO_VERSION }}-
      - run: make ai-check
      - run: make ai-build
      - run: make build-prod
      - run: make csp-headers
      - run: make test-layouts
      - name: Save Hugo build cache
        if: success()
        uses: actions/cache/save@v5
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
      - name: Upload site build
        uses: actions/upload-artifact@v7
        with:
          name: site-build
          path: public/
          retention-days: 1

  deploy:
    if: github.event_name == 'push'
    needs: [lint, unit-tests, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
        with:
          hugo: 'true'
      - name: Restore Hugo cache
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: ${{ runner.os }}-hugo-${{ env.HUGO_VERSION }}-${{ hashFiles('config.toml', 'layouts/**', 'content/**', 'assets/**') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-hugo-${{ env.HUGO_VERSION }}-
      - name: Download site build
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: public/
      - run: make ai-refresh
      - run: make deploy-built
      - run: make cleanup-deployments
      - name: Save Hugo cache
        if: success()
        uses: actions/cache/save@v5
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
