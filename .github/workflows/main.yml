name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HUGO_VERSION: 0.167.0
      HUGO_CACHEDIR: /tmp/hugo_cache
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Read pinned actionlint version
        id: actionlint-version
        run: |
          version=$(awk '$1 == "ACTIONLINT_VERSION" && $2 == ":=" { print $3 }' Makefile)
          test -n "$version"
          echo "version=$version" >> "${GITHUB_OUTPUT}"

      - name: Cache actionlint binary
        id: actionlint-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/actionlint
          key: ${{ runner.os }}-${{ runner.arch }}-actionlint-${{ steps.actionlint-version.outputs.version }}

      - name: Set up Go for actionlint
        if: steps.actionlint-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install actionlint
        if: steps.actionlint-cache.outputs.cache-hit != 'true'
        run: GOBIN="${RUNNER_TEMP}/actionlint" make install-actionlint

      - name: Add actionlint to PATH
        run: |
          echo "${RUNNER_TEMP}/actionlint" >> "${GITHUB_PATH}"

      - name: Cache Hugo binary
        id: hugo-binary-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hugo
          key: ${{ runner.os }}-hugo-bin-${{ env.HUGO_VERSION }}

      - name: Install Hugo
        if: steps.hugo-binary-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/hugo"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --silent --show-error --location \
            "${release}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | tar -xz -C "${{ runner.temp }}/hugo"

      - name: Add Hugo to PATH
        run: echo "${{ runner.temp }}/hugo" >> "${GITHUB_PATH}"

      - name: Restore Hugo build cache
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: ${{ runner.os }}-hugo-${{ env.HUGO_VERSION }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-hugo-${{ env.HUGO_VERSION }}-${{ hashFiles('go.sum') }}-

      - name: Set up Node for Wrangler
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install Node dependencies
        run: make deps

      - name: Validate JavaScript, corpus, Functions and production site
        run: make --jobs=2 --output-sync=target ci-check

      - name: Save Hugo build cache
        if: success()
        uses: actions/cache/save@v5
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Upload JavaScript coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: javascript-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Rebuild and prepare chat embeddings
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: make ai-refresh

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: make deploy-built

      - name: Remove previews and prune old deployments and unreferenced corpora
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: make cleanup-deployments
