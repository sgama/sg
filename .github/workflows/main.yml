name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - develop

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Cache Hugo modules and npm packages
        uses: actions/cache@v4
        with:
          path: |
            /tmp/hugo_cache
            ~/.cache/hugo_cache
            ~/.npm
            resources/_gen
          key: ${{ runner.os }}-build-${{ hashFiles('**/go.sum', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Build
        run: make build

      # --- AI Agent Integration ---
      # This step ensures embeddings are kept in sync with content changes.
      # It runs before deployment so the "brain" has the latest info.
      - name: Generate AI Embeddings
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: make ai-embeddings

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: make deploy-pages

      - name: Build summary
        run: make build-summary

      # Delete previous Cloudflare deployments
      - name: Clean up old deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: make cleanup-deployments
