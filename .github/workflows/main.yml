name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'tests/README.md'
  pull_request:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'tests/README.md'

permissions:
  contents: read

# Production pushes queue behind each other; PR pushes replace the older run.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUGO_VERSION: 0.167.0
  HUGO_CACHEDIR: /tmp/hugo_cache

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # Tooling: each binary is cached on its own key and installed only on a miss.
      - name: Read pinned actionlint version
        id: actionlint-version
        run: |
          version=$(awk '$1 == "ACTIONLINT_VERSION" && $2 == ":=" { print $3 }' Makefile)
          test -n "$version"
          echo "version=$version" >> "${GITHUB_OUTPUT}"
      - uses: actions/cache@v6
        id: actionlint-cache
        with:
          path: ${{ runner.temp }}/actionlint
          key: ${{ runner.os }}-actionlint-${{ steps.actionlint-version.outputs.version }}
      - uses: actions/setup-go@v7
        if: steps.actionlint-cache.outputs.cache-hit != 'true'
        with:
          go-version-file: go.mod
          cache: false
      - name: Install actionlint
        if: steps.actionlint-cache.outputs.cache-hit != 'true'
        run: GOBIN="${RUNNER_TEMP}/actionlint" make install-actionlint
      - run: echo "${RUNNER_TEMP}/actionlint" >> "${GITHUB_PATH}"

      - uses: actions/cache@v6
        id: hugo-binary-cache
        with:
          path: ${{ runner.temp }}/hugo
          key: ${{ runner.os }}-hugo-bin-${{ env.HUGO_VERSION }}
      - name: Install Hugo
        if: steps.hugo-binary-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${RUNNER_TEMP}/hugo"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --silent --show-error --location \
            "${release}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}/hugo"
      - run: echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/cache@v6
        id: node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - name: Install Node dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: make deps

      # Independent checks run concurrently; output is grouped per target.
      - name: Static checks and unit tests
        run: make -j4 --output-sync=target lint-workflows lint format-check coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: javascript-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      # Build: restore the Hugo cache, then run the build-dependent steps.
      - uses: actions/cache/restore@v6
        id: cache-restore
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: ${{ runner.os }}-hugo-${{ env.HUGO_VERSION }}-${{ hashFiles('config.toml', 'layouts/**', 'content/**', 'assets/**') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-hugo-${{ env.HUGO_VERSION }}-
      - name: Bundle functions and build production site
        run: make -j2 --output-sync=target ai-build build-prod
      - run: make csp-headers
      - run: make ai-check
      - run: make test-layouts
      - uses: actions/cache/save@v6
        if: success()
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      # Deploy only on push to develop; PRs stop after validation.
      - name: Refresh chat corpus
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: make ai-refresh
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: make deploy-built
      - name: Prune old deployments and corpora
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: make cleanup-deployments
