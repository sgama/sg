name: Setup
description: Checkout, install Hugo (optional), Node, and dependencies with caching
inputs:
  hugo:
    description: 'Install Hugo extended binary'
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Cache Hugo binary
      if: inputs.hugo == 'true'
      id: hugo-binary-cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/hugo
        key: ${{ runner.os }}-hugo-bin-${{ env.HUGO_VERSION }}
    - name: Install Hugo
      if: inputs.hugo == 'true' && steps.hugo-binary-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p "${{ runner.temp }}/hugo"
        release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
        curl --fail --silent --show-error --location \
          "${release}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
          | tar -xz -C "${{ runner.temp }}/hugo"
    - name: Add Hugo to PATH
      if: inputs.hugo == 'true'
      shell: bash
      run: echo "${{ runner.temp }}/hugo" >> "${GITHUB_PATH}"
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
    - uses: actions/cache@v6
      id: node-modules
      with:
        path: node_modules
        key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
    - name: Install Node dependencies
      if: steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: make deps
