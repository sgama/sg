version: 2
# NOTE: Dependabot covers npm (package.json), gomod (go.mod), and github-actions
# (workflow action versions). Pinned versions outside package managers are NOT
# auto-checked and must be updated manually:
#   - HUGO_VERSION in .github/workflows/main.yml (currently 0.167.0; Blowfish max)
#   - node-version in .github/workflows/main.yml (currently 24)
#   - compatibility_date in wrangler.toml (currently 2026-04-20)
#   - Blowfish theme version in go.mod (covered by gomod ecosystem above)
# Review these on the first Monday of each month.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Vancouver
    target-branch: develop
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: 'chore(deps)'
      include: scope
    groups:
      npm:
        patterns:
          - '*'

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Vancouver
    target-branch: develop
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
    commit-message:
      prefix: 'chore(deps)'
      include: scope
    groups:
      gomod:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Vancouver
    target-branch: develop
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: 'chore(ci)'
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'
