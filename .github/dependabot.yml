version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Vancouver
    target-branch: develop
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      postcss:
        patterns:
          - "postcss*"
          - "autoprefixer"
          - "cssnano"
          - "@fullhuman/*"
      wrangler:
        patterns:
          - "wrangler"
          - "@cloudflare/*"
      dev-minor:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Toronto
    target-branch: develop
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - go
      - hugo-theme
    commit-message:
      prefix: "chore(deps)"
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Toronto
    target-branch: develop
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
      include: scope
    groups:
      actions-minor:
        update-types:
          - minor
          - patch
