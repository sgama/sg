name = "sg"
main = "functions/worker.js"
compatibility_date = "2026-04-20"
minify = true

# The static site (Hugo's output) is served by Cloudflare directly. The Worker runs first only for the API paths
# (functions/worker.js), so page requests never invoke it. Hugo emits 404.html for unknown pages.
[assets]
directory = "./public"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

# Workers AI Binding (The "Brain")
[ai]
binding = "AI"

# KV Namespace Binding (Chat Logs - Simple & Fast)
# Run `npx wrangler kv namespace create chat_logs` to get the ID
[[kv_namespaces]]
binding = "CHAT_LOGS"
id = "2a8435a82e17425d8cff4b2777dbfd98"

# Environment variables for the Worker. `make deploy-built` also sets DEPLOY_COMMIT (the commit being deployed).
[vars]
AI_MODEL = "glm"
# CI sets AI_CORPUS_NAMESPACE after `make ai-refresh` finishes indexing the commit's corpus.
# Local deployments can use ai-refresh or set a previously validated namespace.

# Vectorize Binding (The "Long Term Memory")
[[vectorize]]
binding = "VECTORIZE_INDEX"
index_name = "portfolio-index"

# OPENAI_API_KEY = "" # If using OpenAI instead of Cloudflare AI
# /api/logs is intentionally public for demonstration; transcript authentication is disabled.
