# Hugo Configuration File
# Consolidated configuration for samsongama.com

baseURL = "https://samsongama.com"
buildDrafts = false
buildFuture = false
defaultContentLanguage = "en"
enableEmoji = true
enableRobotsTXT = true
hasCJKLanguage = false
hideColorSchemeToggle = false
summaryLength = 30
title = "Samson Gama"

# Asset processing and inlining
[build]

[build.buildStats]
enable = false

# Imaging configuration
[imaging]
anchor = "Center"

# Language configuration
[languages]

[languages.en]
disabled = false
languageCode = "en"
languageName = "English"
title = "Samson Gama"
weight = 1

[languages.en.params]
dateFormat = "2 January 2006"
description = ""
displayName = "EN"
isoCode = "en"
# logo = "icon.svg"
rtl = false

[languages.en.params.author]
bio = "bbb"
image = "samson.webp"
links = [
  { github = "https://github.com/sgama" },
  { instagram = "https://instagram.com/watts.up.ohmie" },
  { linkedin = "https://linkedin.com/in/samsongama" },
  { signal = "https://signal.me/#eu/3unmmwMbX_hNPWywXwlHuZQYNwPRI0vaqlVAZuVjVazezrt-onhIxY5ATPn2ZFjg" },
  { spotify = "https://open.spotify.com/user/+samson" },
]
name = "Samson Gama"

# Markup configuration
[markup]

[markup.goldmark]

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
noClasses = false

[markup.tableOfContents]
endLevel = 4
startLevel = 1

[menu]

[[menu.main]]
name = "About"
pageRef = "about"
weight = 10

[[menu.main]]
name = "Posts"
pageRef = "posts"
weight = 20

[[menu.main]]
name = "Portfolio"
pageRef = "portfolio"
weight = 30

[[menu.main]]
name = "Resume"
pageRef = "resume"
weight = 40

[[menu.main]]
name = "Contact"
pageRef = "contact"
weight = 50

[module]

[module.hugoVersion]
extended = true
max = "0.154.5"
min = "0.141.0"

# Module configuration
[[module.imports]]
disable = false
path = "github.com/martignoni/hugo-notice"

[[module.imports]]
disable = false
path = "github.com/nunocoracao/blowfish/v2"

# Output formats
[outputs]
home = ["HTML", "RSS", "JSON"]

# Pagination
[pagination]
pagerSize = 100

# Theme parameters
[params]
autoSwitchAppearance = false
colorScheme = "catppuccin"
defaultAppearance = "dark"
defaultBackgroundImage = "background.webp"
disableImageOptimization = false
disableImageOptimizationMD = false
disableTextInHeader = false
enableA11y = true
enableCodeCopy = true
enableSearch = true
highlightCurrentMenuArea = true
mainSections = ["portfolio", "posts"]
replyByEmail = false
smartTOC = true
smartTOCHideUnfocusedChildren = ""

[params.article]
editAppendPath = true
heroStyle = "background"
invertPagination = false
layoutBackgroundBlur = true
layoutBackgroundHeaderSpace = true
relatedContentLimit = 3
seriesOpened = false
sharingLinks = ["linkedin", "mastodon", "whatsapp", "email", "facebook"]
showAuthor = false
showAuthorsBadges = false
showBreadcrumbs = true
showComments = false
showDate = true
showDateOnlyInArticle = false
showDateUpdated = false
showDraftLabel = true
showEdit = false
showHeadingAnchors = true
showHero = true
showLikes = false
showPagination = true
showReadingTime = false
showRelatedContent = true
showTableOfContents = true
showTaxonomies = true
showViews = false
showWordCount = false
showZenMode = true

# JavaScript and asset optimization
[params.assets]
bundle = true
format = "esm"
# Enable inlining for critical assets
inline = true
inlineThreshold = 1048576 # 1MB
minify = true
target = "es2018"

# JavaScript processing - target modern browsers
[params.build]
target = "es2018"
writeStats = false

# CDN configuration for vendor libraries
[params.vendor]
useCDN = true # Set to false to use local assets from theme

[params.vendor.jquery]
url = "https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.slim.min.js"
integrity = "sha512-sNylduh9fqpYUK5OYXWcBleGzbZInWj8yCJAU57r1dpSK9tP2ghf/SRYCMj+KsslFkCOt3TvJrX2AV/Gc3wOqA=="

