# Hugo Configuration File
# Consolidated configuration for samsongama.com

baseURL = "https://samsongama.com"
buildDrafts = false
buildFuture = false
defaultContentLanguage = "en"
enableEmoji = true
enableRobotsTXT = true
hideColorSchemeToggle = true
summaryLength = 0
title = "Samson Gama"

# Asset processing and inlining
[build]

[build.buildStats]
enable = false

# Imaging configuration
[imaging]
anchor = "Center"

# Language configuration
[languages]

[languages.en]
disabled = false
languageCode = "en"
languageName = "English"
title = "Samson Gama"
weight = 1

[languages.en.params]
dateFormat = "2 January 2006"
description = ""
displayName = "EN"
isoCode = "en"
# logo = "icon.svg"
rtl = false

[languages.en.params.author]
bio = "bbb"
image = "samson.webp"
name = "Samson Gama"
links = [
  { github = "https://github.com/sgama" },
  { instagram = "https://instagram.com/watts.up.ohmie" },
  { linkedin = "https://linkedin.com/in/samsongama" },
  { signal = "https://signal.me/#eu/3unmmwMbX_hNPWywXwlHuZQYNwPRI0vaqlVAZuVjVazezrt-onhIxY5ATPn2ZFjg" },
  { spotify = "https://open.spotify.com/user/+samson" }
]
# Markup configuration
[markup]

[markup.goldmark]

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
noClasses = false

[markup.tableOfContents]
endLevel = 4
startLevel = 1

[menu]

[[menu.main]]
name = "About"
pageRef = "about"
weight = 10

[[menu.main]]
name = "Posts"
pageRef = "posts"
weight = 20

[[menu.main]]
name = "Portfolio"
pageRef = "portfolio"
weight = 30

[[menu.main]]
name = "Resume"
pageRef = "resume"
weight = 40

[[menu.main]]
name = "Contact"
pageRef = "contact"
weight = 50

# Asset processing
[minify]

[minify.tdewolff]

[minify.tdewolff.js]
keepVarNames = true
precision = 0

[module]

[module.hugoVersion]
extended = false
min = "0.87.0"

# Module configuration
[[module.imports]]
disable = false
path = "github.com/martignoni/hugo-notice"

[[module.imports]]
disable = false
path = "github.com/nunocoracao/blowfish/v2"

# Output formats
[outputs]
home = ["HTML", "RSS", "JSON"]

# Pagination
[pagination]
pagerSize = 100

# Theme parameters
[params]
autoSwitchAppearance = false
colorScheme = "catppuccin"
defaultAppearance = "dark"
defaultBackgroundImage = "background.webp"
disableImageOptimization = false
disableTextInHeader = false
enableA11y = true
enableCodeCopy = true
enableSearch = true
highlightCurrentMenuArea = true
mainSections = ["portfolio", "posts"]
replyByEmail = false
smartTOC = true
smartTOCHideUnfocusedChildren = ""

[params.article]
editAppendPath = true
heroStyle = "background"
invertPagination = false
layoutBackgroundBlur = true
layoutBackgroundHeaderSpace = true
relatedContentLimit = 3
seriesOpened = false
sharingLinks = ["linkedin", "mastodon", "whatsapp", "email", "facebook"]
showAuthor = false
showAuthorsBadges = false
showBreadcrumbs = true
showComments = false
showDate = true
showDateOnlyInArticle = false
showDateUpdated = false
showDraftLabel = true
showEdit = false
showHeadingAnchors = true
showHero = true
showLikes = false
showPagination = true
showReadingTime = false
showRelatedContent = true
showTableOfContents = true
showTaxonomies = true
showViews = false
showWordCount = false
showZenMode = true

# JavaScript and asset optimization
[params.assets]
bundle = true
format = "esm"
# Enable inlining for critical assets
inline = true
inlineThreshold = 65536  # Inline assets smaller than 64KB
minify = true
target = "es2018"

# JavaScript processing - target modern browsers
[params.build]
target = "es2018"
writeStats = false

[params.footer]
showAppearanceSwitcher = false
showCopyright = true
showMenu = true
showScrollToTop = true
showThemeAttribution = false

[params.header]
layout = "fixed-fill-blur"

[params.homepage]
cardView = true
cardViewScreenWidth = false
disableHeroImageFilter = false
layout = "background"
layoutBackgroundBlur = true
showMoreLink = true
showMoreLinkDest = "/portfolio/"
showRecent = true
showRecentItems = 3

# Disable legacy JavaScript features
[params.js]
enableLegacyBrowser = false
enablePolyfills = false
transpileTarget = "es2018"

[params.list]
cardView = true
cardViewScreenWidth = false
constrainItemsWidth = true
groupByYear = false
heroStyle = "background"
layoutBackgroundBlur = true
layoutBackgroundHeaderSpace = false
orderByWeight = true
showBreadcrumbs = false
showCards = true
showHero = true
showLikes = false
showSummary = false
showTableOfContents = true
showViews = false

# Enable asset inlining
[params.optimization]
criticalCSS = true
inlineCSS = true
inlineJS = true
# Inline threshold in bytes (64KB default)
inlineThreshold = 65536

[params.sitemap]
excludedKinds = ["taxonomy", "term"]

[params.taxonomy]
cardView = false
showBreadcrumbs = false
showHero = true
showLikes = false
showTableOfContents = true
showTermCount = true
showViews = false

[params.term]
cardView = ""
cardViewScreenWidth = false
groupByYear = false
showBreadcrumbs = false
showHero = true
showLikes = false
showTableOfContents = true
showViews = false

# Related content
[related]
indices = [
  {name = "tags", weight = 100},
  {name = "categories", weight = 100},
  {name = "series", weight = 50},
  {name = "authors", weight = 20},
  {name = "date", weight = 10},
  {applyFilter = false, name = "fragmentrefs", type = "fragments", weight = 10}
]
threshold = 10
toLower = false

# Sitemap configuration
[sitemap]
changefreq = "daily"
filename = "sitemap.xml"
priority = 0.5

# Taxonomies
[taxonomies]
author = "authors"
category = "categories"
series = "series"
tag = "tags"
