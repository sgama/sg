# Hugo Configuration File
# Consolidated configuration for samsongama.com
# Documentation: https://gohugo.io/getting-started/configuration/
# Blowfish Theme: https://blowfish.page/docs/configuration/

# Base configuration - https://gohugo.io/getting-started/configuration/#all-configuration-settings
baseURL = "https://samsongama.com"
buildDrafts = false  # https://gohugo.io/getting-started/configuration/#builddrafts
buildFuture = false  # https://gohugo.io/getting-started/configuration/#buildfuture
cleanDestinationDir = true  # https://gohugo.io/getting-started/configuration/#cleandestinationdir
defaultContentLanguage = "en"  # https://gohugo.io/getting-started/configuration/#defaultcontentlanguage
disableHugoGeneratorInject = true  # https://gohugo.io/getting-started/configuration/#disablehugogeneratorinject
enableEmoji = true  # https://gohugo.io/getting-started/configuration/#enableemoji
enableGitInfo = false  # https://gohugo.io/getting-started/configuration/#enablegitinfo (faster builds)
enableRobotsTXT = true  # https://gohugo.io/getting-started/configuration/#enablerobotstxt
hasCJKLanguage = false  # https://gohugo.io/getting-started/configuration/#hascjklanguage
# Ignore development files and directories to speed up builds
ignoreFiles = [
  "\\.git",
  "\\.github",
  "\\.vscode",
  "tests",
  "results",
  "node_modules",
  "package\\.json",
  "package-lock\\.json",
  "docker-compose\\.yml",
  "generate_favicons\\.sh",
  "LICENSE",
  "Makefile",
  "README\\.md"
]
summaryLength = 20  # Lower = faster processing (20 words instead of 30)
timeout = "30s"  # https://gohugo.io/getting-started/configuration/#timeout
title = "Samson Gama"

# Build configuration - https://gohugo.io/getting-started/configuration/#configure-build
[build]
useResourceCacheWhen = "always"  # https://gohugo.io/getting-started/configuration/#configure-build

[build.buildStats]
disableKinds = []  # Don't disable any content kinds
enable = false
writeStats = false  # Don't write build stats

# Cache configuration - https://gohugo.io/getting-started/configuration/#configure-file-caches
[caches]

[caches.assets]
dir = ":resourceDir/_gen"
maxAge = "24h"

[caches.getcsv]
dir = ":cacheDir/:project"
maxAge = "24h"

[caches.getjson]
dir = ":cacheDir/:project"
maxAge = "24h"

[caches.getresource]
dir = ":cacheDir/:project"
maxAge = "24h"

[caches.images]
dir = ":resourceDir/_gen"
maxAge = "720h"  # 30 days for images

[caches.modules]
dir = ":cacheDir/modules"
maxAge = "720h"

# EXIF configuration - https://gohugo.io/content-management/image-processing/#exif-data
[imaging.exif]
disableDate = true
disableLatLong = true  # Privacy + smaller metadata
excludeFields = "GPS"

# Language configuration - https://gohugo.io/content-management/multilingual/
[languages]

[languages.en]
disabled = false
languageCode = "en"
languageName = "English"
title = "Samson Gama"
weight = 1

[languages.en.params]
dateFormat = "2 January 2006"
description = ""
displayName = "EN"
isoCode = "en"
# logo = "icon.svg"
rtl = false

[languages.en.params.author]
bio = "Samson Gama is a software developer, tech enthusiast, and lifelong learner with a passion for creating innovative solutions and sharing knowledge through writing and collaboration."
image = "samson.webp"
links = [
  {github = "https://github.com/sgama"},
  {instagram = "https://instagram.com/watts.up.ohmie"},
  {linkedin = "https://linkedin.com/in/samsongama"},
  {signal = "https://signal.me/#eu/3unmmwMbX_hNPWywXwlHuZQYNwPRI0vaqlVAZuVjVazezrt-onhIxY5ATPn2ZFjg"},
  {spotify = "https://open.spotify.com/user/+samson"}
]
name = "Samson Gama"

# Markup configuration - https://gohugo.io/getting-started/configuration-markup/
[markup]

# Goldmark (Markdown renderer) - https://gohugo.io/getting-started/configuration-markup/#goldmark
[markup.goldmark]

[markup.goldmark.parser]
autoHeadingID = true  # https://gohugo.io/getting-started/configuration-markup/#goldmark
autoHeadingIDType = "github"
wrapStandAloneImageWithinParagraph = false

[markup.goldmark.renderer]
hardWraps = false
unsafe = true  # https://gohugo.io/getting-started/configuration-markup/#goldmark

# Syntax highlighting - https://gohugo.io/getting-started/configuration-markup/#highlight
[markup.highlight]
noClasses = false

[markup.tableOfContents]
endLevel = 4
startLevel = 1

[mediaTypes]

[mediaTypes."text/llms"]
suffixes = ["txt"]

[menu]

[[menu.main]]
name = "About"
pageRef = "about"
weight = 10

[[menu.main]]
name = "Posts"
pageRef = "posts"
weight = 20

[[menu.main]]
name = "Portfolio"
pageRef = "portfolio"
weight = 30

[[menu.main]]
name = "Resume"
pageRef = "resume"
weight = 40

[[menu.main]]
name = "Contact"
pageRef = "contact"
weight = 50

# Minification configuration - https://gohugo.io/getting-started/configuration/#configure-minify
[minify]
disableCSS = false
disableHTML = false
disableJS = false
disableJSON = false
disableSVG = false
disableXML = false
minifyOutput = true

[minify.tdewolff]

[minify.tdewolff.css]
inline = true  # Inline @import and url() for smaller output
precision = 0  # Lower precision = smaller files
version = 3  # Use CSS3+ (more modern, smaller output)

[minify.tdewolff.html]
keepComments = false
keepDefaultAttrVals = true
keepDocumentTags = true
keepEndTags = true
keepQuotes = false
keepSpecialComments = true
keepWhitespace = false
templateDelims = ['', '']

[minify.tdewolff.js]
keepVarNames = false  # Minify variable names
precision = 0
version = 2022

[minify.tdewolff.json]
keepNumbers = false  # Convert numbers to shorter forms
precision = 0  # No decimal places in output

[minify.tdewolff.svg]
keepComments = false
precision = 2

[minify.tdewolff.xml]
keepWhitespace = false

# Hugo Modules - https://gohugo.io/hugo-modules/configuration/
[module]

[module.hugoVersion]
extended = true
max = "0.154.5"
min = "0.141.0"

# Theme and module imports - https://gohugo.io/hugo-modules/use-modules/
[[module.imports]]
disable = false
path = "github.com/martignoni/hugo-notice"  # Notice shortcode

[[module.imports]]
disable = false
path = "github.com/nunocoracao/blowfish/v2"  # Main theme

[outputFormats]

[outputFormats.LLMS]
baseName = "llms"
isPlainText = true
mediaType = "text/llms"

# Output formats - https://gohugo.io/templates/output-formats/
[outputs]
home = ["HTML", "RSS", "JSON", "LLMS"]  # JSON needed for search; LLMS for AI
section = ["HTML", "RSS"]
taxonomy = ["HTML"]
term = ["HTML"]

# Pagination - https://gohugo.io/templates/pagination/
[pagination]
pagerSize = 50  # Lower = fewer pages to generate = faster builds

# Blowfish theme parameters - https://blowfish.page/docs/configuration/#theme-parameters
[params]
autoSwitchAppearance = false  # https://blowfish.page/docs/configuration/#appearance
colorScheme = "catppuccin"  # https://blowfish.page/docs/configuration/#color-schemes
defaultAppearance = "dark"  # https://blowfish.page/docs/configuration/#appearance
defaultBackgroundImage = "background.webp"
disableImageOptimization = false  # Keep false to use Hugo's optimization
disableImageOptimizationMD = false
disableTextInHeader = false
enableA11y = true
enableCodeCopy = true
enableSearch = true  # https://blowfish.page/docs/partials/#search
fingerprintAlgorithm = "sha256"  # Faster than sha512
highlightCurrentMenuArea = true
mainSections = ["portfolio", "posts"]  # https://gohugo.io/methods/site/mainsections/
replyByEmail = false
smartTOC = true
smartTOCHideUnfocusedChildren = ""

# Article layout - https://blowfish.page/docs/content-examples/#articles
[params.article]
editAppendPath = true
heroStyle = "background"  # Options: basic, big, background, thumbAndBackground
invertPagination = false
layoutBackgroundBlur = true
layoutBackgroundHeaderSpace = true
relatedContentLimit = 3
seriesOpened = false
sharingLinks = ["linkedin", "mastodon", "whatsapp", "email", "facebook"]
showAuthor = false
showAuthorsBadges = false
showBreadcrumbs = true
showComments = false
showDate = true
showDateOnlyInArticle = false
showDateUpdated = false
showDraftLabel = true
showEdit = false
showHeadingAnchors = true
showHero = true
showLikes = false
showPagination = true
showReadingTime = true
showRelatedContent = true
showTableOfContents = true
showTaxonomies = true
showViews = false
showWordCount = true
showZenMode = true

[params.article.giscus]
category = "Announcements"
categoryId = "DIC_kwDOByy8hc4C1dRG"
emitMetadata = "0"
inputPosition = "top"
lang = "en"
loading = "lazy"
mapping = "pathname"
reactionsEnabled = "1"
repo = "sgama/sg"
repoId = "MDEwOlJlcG9zaXRvcnkxMjAzNzIzNTc="
theme = "catppuccin_mocha"

# Footer configuration - https://blowfish.page/docs/configuration/#footer
[params.footer]
showAppearanceSwitcher = false
showCopyright = true
showMenu = true
showScrollToTop = true
showThemeAttribution = false

# Header configuration - https://blowfish.page/docs/configuration/#header
[params.header]
layout = "fixed-gradient"  # Options: basic, fixed, fixed-fill, fixed-gradient, fixed-fill-blur

# Homepage configuration - https://blowfish.page/docs/homepage-layout/
[params.homepage]
cardView = true
cardViewScreenWidth = false
disableHeroImageFilter = false  # only used when layout equals hero
layout = "custom"  # valid options: page, profile, hero, card, background, custom
layoutBackgroundBlur = true
showMoreLink = true
showMoreLinkDest = "/portfolio/"
# homepageImage = "IMAGE.jpg" # used in: hero, and card
showRecent = true
showRecentItems = 3

# List layout - https://blowfish.page/docs/content-examples/#list-layouts
[params.list]
cardView = true
cardViewScreenWidth = false
constrainItemsWidth = true
groupByYear = false
heroStyle = "background"
layoutBackgroundHeaderSpace = false
orderByWeight = true
showBreadcrumbs = false
showCards = true
showHero = true
showLikes = false
showSummary = false
showTableOfContents = true
showViews = false

# Sitemap parameters - https://blowfish.page/docs/configuration/#sitemap
[params.sitemap]
excludedKinds = ["taxonomy", "term"]

# Taxonomy layout - https://blowfish.page/docs/content-examples/#taxonomies
[params.taxonomy]
cardView = false
showBreadcrumbs = false
showHero = true
showLikes = false
showTableOfContents = true
showTermCount = true
showViews = false

# Term layout - https://blowfish.page/docs/content-examples/#taxonomy-terms
[params.term]
cardView = ""
cardViewScreenWidth = false
groupByYear = false
showBreadcrumbs = false
showHero = true
showLikes = false
showTableOfContents = true
showViews = false

# Related content - https://gohugo.io/content-management/related/
[related]
includeNewer = true
indices = [
  {name = "tags", weight = 100},
  {name = "categories", weight = 100},
  {name = "series", weight = 50},
  {name = "authors", weight = 20},
  {name = "date", weight = 10},
  {applyFilter = false, name = "fragmentrefs", type = "fragments", weight = 10}
]
threshold = 50  # Higher threshold = fewer related items = faster
toLower = true  # Normalize for better matches

# Sitemap configuration - https://gohugo.io/templates/sitemap-template/#configuration
[sitemap]
changefreq = "daily"
filename = "sitemap.xml"
priority = 0.5

# Taxonomies - https://gohugo.io/content-management/taxonomies/
[taxonomies]
author = "authors"
category = "categories"
series = "series"
tag = "tags"

[umamiAnalytics]
domain = "ping.samsongama.com"
scriptName = "script.js"
websiteid = "7b6c2554-f791-4546-8ea5-894496e4f9b6"
