[params.footer]
showAppearanceSwitcher = false
showCopyright = true
showMenu = true
showScrollToTop = true
showThemeAttribution = false

[params.header]
layout = "fixed-fill-blur"

[params.homepage]
cardView = true
cardViewScreenWidth = false
disableHeroImageFilter = false
layout = "background"
layoutBackgroundBlur = true
showMoreLink = true
showMoreLinkDest = "/portfolio/"
showRecent = true
showRecentItems = 3

# Disable legacy JavaScript features
[params.js]
enableLegacyBrowser = false
enablePolyfills = false
transpileTarget = "es2018"

[params.list]
cardView = true
cardViewScreenWidth = false
constrainItemsWidth = true
groupByYear = false
heroStyle = "background"
layoutBackgroundHeaderSpace = false
orderByWeight = true
showBreadcrumbs = false
showCards = true
showHero = true
showLikes = false
showSummary = false
showTableOfContents = true
showViews = false

# Enable asset inlining
[params.optimization]
criticalCSS = true
inlineCSS = true
inlineJS = true
# Inline threshold in bytes (64KB default)
inlineThreshold = 65536

[params.sitemap]
excludedKinds = ["taxonomy", "term"]

[params.taxonomy]
cardView = false
showBreadcrumbs = false
showHero = true
showLikes = false
showTableOfContents = true
showTermCount = true
showViews = false

[params.term]
cardView = ""
cardViewScreenWidth = false
groupByYear = false
showBreadcrumbs = false
showHero = true
showLikes = false
showTableOfContents = true
showViews = false

# Related content
[related]
indices = [
  { name = "tags", weight = 100 },
  { name = "categories", weight = 100 },
  { name = "series", weight = 50 },
  { name = "authors", weight = 20 },
  { name = "date", weight = 10 },
  { applyFilter = false, name = "fragmentrefs", type = "fragments", weight = 10 },
]
threshold = 10
toLower = false

# Sitemap configuration
[sitemap]
changefreq = "daily"
filename = "sitemap.xml"
priority = 0.5

# Taxonomies
[taxonomies]
author = "authors"
category = "categories"
series = "series"
tag = "tags"
