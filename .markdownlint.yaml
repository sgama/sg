# Markdownlint configuration for Hugo site
# See: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md

# Default state for all rules
default: true

# Disable specific rules that conflict with Hugo
MD013: false  # Line length - Hugo content can have long lines
MD033: false  # Inline HTML - Hugo uses HTML in markdown
MD041: false  # First line in file should be a top level header - Hugo uses front matter
MD025: false  # Multiple top level headers in the same document - Hugo posts can have multiple H1s

# Customize specific rules
MD003:  # Header style
  style: "atx"

MD004:  # Unordered list style
  style: "dash"

MD007:  # Unordered list indentation
  indent: 2

MD009:  # Trailing spaces
  br_spaces: 2

MD010:  # Hard tabs
  code_blocks: false

MD012:  # Multiple consecutive blank lines
  maximum: 2

MD022:  # Headers should be surrounded by blank lines
  lines_above: 1
  lines_below: 1

MD024:  # Multiple headers with the same content
  allow_different_nesting: true

MD026:  # Trailing punctuation in headers
  punctuation: ".,;:!?"

MD029:  # Ordered list item prefix
  style: "ordered"

MD030:  # Spaces after list markers
  ul_single: 1
  ol_single: 1
  ul_multi: 1
  ol_multi: 1

MD035:  # Horizontal rule style
  style: "---"

MD036:  # Emphasis used instead of headers
  punctuation: ".,;:!?"

MD046:  # Code block style
  style: "fenced"

MD048:  # Code fence style
  style: "backtick"

# Files to ignore
ignore:
  - "themes/"
  - "node_modules/"
  - "README.md"  # Often has specific formatting requirements
