# Typos configuration for spell checking
# See: https://github.com/crate-ci/typos

[default.extend-words]
PNG = "PNG"
PNGs = "PNGs"
api = "api"
apis = "apis"
# Project specific terms
boardcast = "boardcast"
config = "config"
configs = "configs"
css = "css"
gama = "gama"
html = "html"
# Hugo and web development specific terms
hugo = "hugo"
ico = "ico"
js = "js"
md = "md"
png = "png"
pngs = "pngs"
samson = "samson"
# Personal/project specific terms
samsongama = "samsongama"
svg = "svg"
toml = "toml"
url = "url"
urls = "urls"
webp = "webp"
yaml = "yaml"
yml = "yml"

[files]
# Files to check
extend-exclude = [
  "*.min.js",
  "*.min.css",
  "node_modules/",
  "themes/",
  ".git/",
  "*.lock",
  "*.log",
  "static/css/",
  "static/js/",
  "public/",
  "resources/"
]
# Gitignored files are skipped by default; hidden files are checked.
ignore-hidden = true

[type.md]
# Markdown specific configuration
extend-glob = ["*.md"]

[type.toml]
# TOML specific configuration
extend-glob = ["*.toml"]

[type.yaml]
# YAML specific configuration
extend-glob = ["*.yaml", "*.yml"]
