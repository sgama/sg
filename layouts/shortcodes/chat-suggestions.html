<ul class="chat-cta__chips">
    {{- range $i, $q := site.Data.chat_suggestions.suggestions -}}
    <li class="chat-cta__chip-item">
        <button class="chat-cta__chip js-chat-trigger" type="button" data-question="{{ $q }}"{{ if ge $i 4 }} hidden{{ end }}>{{ $q }}</button>
    </li>
    {{- end -}}
</ul>
