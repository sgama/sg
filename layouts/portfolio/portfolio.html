{{ define "main" }}
<div role="main" class="container">
    {{ with .Content }}
    <div class="well">{{ . }}</div>
    {{ end }}
    {{ range where .Site.RegularPages "Type" "portfolio" }}
    <a href={{ .Permalink }}>
        <div class="col-lg-4 col-sm-6">
            <img class="img-rounded"
                 src="{{ .Params.Thumbnail }}"
                 alt="{{ .Title }}"
                 width="100%"
                 height="100%">
            <h4>{{ .Title }}</h4>
        </div>
    </a>
    {{ end }}
</div>
{{ end }}
