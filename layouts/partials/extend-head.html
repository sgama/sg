<!-- Preconnect to external domains for faster resource loading -->
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://fonts.googleapis.com">
<link rel="dns-prefetch" href="https://fonts.gstatic.com">

<!-- Preload critical CSS to reduce render blocking -->
{{ $cssPath := "css/main.bundle.min.*.css" }}
{{ range (resources.Match $cssPath) }}
<link rel="preload" href="{{ .RelPermalink }}" as="style">
{{ end }}

<!-- Preload critical fonts -->
{{ $fontPath := "**/*.woff2" }}
{{ range (resources.Match $fontPath) }}
<link rel="preload" href="{{ .RelPermalink }}" as="font" type="font/woff2" crossorigin>
{{ end }}
