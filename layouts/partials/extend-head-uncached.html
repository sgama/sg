{{ if .IsHome }}
    {{ $images := partialCached "home/images.html" .Site .Site.Language.Lang }}
    {{ range slice $images.background $images.avatar }}
        {{ with .preload }}
            {{ if .src }}
                <link rel="preload" as="image" href="{{ .src }}"{{ with .type }} type="{{ . }}"{{ end }} fetchpriority="high">
            {{ end }}
        {{ end }}
    {{ end }}
{{ end }}
